{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <div class="masthead__menu">
      <nav id="site-nav" class="greedy-nav">
        <button type="button" aria-controls="hidden-links" aria-expanded="false" aria-label="Toggle navigation menu" id="nav-toggle" class="hidden"><div class="navicon"></div></button>
        <ul class="visible-links">
          <li class="masthead__menu-item masthead__menu-item--lg persist"><a href="{{ base_path }}/">{{ site.title }}</a></li>
          {% for link in site.data.navigation.main %}
            {% if link.url contains 'http' %}
              {% assign domain = '' %}
            {% else %}
              {% assign domain = base_path %}
            {% endif %}
            <li class="masthead__menu-item"><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
          {% endfor %}
          <li id="theme-toggle" class="masthead__menu-item persist tail">
            <a><i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true" title="toggle theme"></i></a>
          </li>
        </ul>
        <ul id="hidden-links" class="hidden-links hidden" aria-hidden="true"></ul>
      </nav>
      <script>
        (function () {
          const toggle = document.getElementById('nav-toggle');
          const menu = document.getElementById('hidden-links');
          if (!toggle || !menu) return;

          const sync = () => {
            const isOpen = !menu.classList.contains('hidden');
            menu.classList.toggle('open', isOpen);
            toggle.setAttribute('aria-expanded', String(isOpen));
            menu.setAttribute('aria-hidden', String(!isOpen));
            toggle.classList.toggle('close', isOpen);
          };

          // Sync when greedy-nav toggles .hidden on click or during resize/updateNav
          if (window.MutationObserver) {
            const observer = new MutationObserver(sync);
            observer.observe(menu, { attributes: true, attributeFilter: ['class'] });
          } else {
            toggle.addEventListener('click', () => window.setTimeout(sync, 0));
          }

          document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !menu.classList.contains('hidden')) {
              toggle.click();
            }
          });

          sync();
        })();
      </script>
    </div>
  </div>
</div>
